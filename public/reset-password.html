<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifre Sıfırla - Anadolu Çiftlik</title>
<style>
body { background: #0a0f1a; color: #e9eef8; font-family: 'Segoe UI', sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 20px; }
.box { background: #111a2c; border: 1px solid #1f2c47; border-radius: 24px; padding: 36px; max-width: 420px; width: 100%; text-align: center; }
h1 { font-size: 1.4rem; margin-bottom: 8px; }
p { color: #8ca0c4; font-size: .9rem; margin-bottom: 20px; }
input { width: 100%; padding: 13px 15px; border-radius: 11px; background: #16223a; border: 1px solid #1f2c47; color: #e9eef8; font-size: .95rem; margin-bottom: 16px; box-sizing: border-box; }
button { width: 100%; padding: 14px; border: none; border-radius: 11px; font-weight: 800; font-size: .95rem; background: linear-gradient(135deg,#22c55e,#16a34a); color: #03150a; cursor: pointer; }
.msg { padding: 12px; border-radius: 10px; font-size: .85rem; margin-bottom: 14px; display: none; }
.msg.show { display: block; }
.msg.err { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.4); color: #ff8a80; }
.msg.ok { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.4); color: #7ceb9e; }
</style>
</head>
<body>
<div class="box">
  <h1>🔑 Yeni Şifre Belirle</h1>
  <p>Lütfen yeni şifrenizi girin.</p>
  <div class="msg" id="msg"></div>
  <input type="password" id="newPass" placeholder="Yeni şifreniz (en az 8 karakter)" required>
  <button onclick="resetPassword()">Şifremi Güncelle</button>
</div>

<script>
const API_BASE = "/api";
async function resetPassword() {
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get("token");
  const newPassword = document.getElementById("newPass").value;
  const msg = document.getElementById("msg");

  if (!token) { msg.className = "msg show err"; msg.textContent = "Geçersiz link."; return; }
  if (!newPassword || newPassword.length < 8) { msg.className = "msg show err"; msg.textContent = "Şifre en az 8 karakter olmalı."; return; }

  try {
    const res = await fetch(`${API_BASE}/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Bir hata oluştu");
    msg.className = "msg show ok";
    msg.textContent = "✅ Şifreniz güncellendi! Giriş sayfasına yönlendiriliyorsunuz...";
    setTimeout(() => { window.location.href = "/"; }, 2000);
  } catch (err) {
    msg.className = "msg show err";
    msg.textContent = "❌ " + err.message;
  }
}
</script>
</body>
</html>
